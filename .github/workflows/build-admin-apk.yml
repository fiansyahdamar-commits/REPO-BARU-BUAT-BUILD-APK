name: Build Zall RW Admin APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-admin-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Smoke-test APK startup in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: false
          script: |
            set -e
            adb wait-for-device
            for attempt in $(seq 1 30); do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOT" = "1" ]; then break; fi
              sleep 5
            done
            if [ "$BOOT" != "1" ]; then
              echo "Emulator did not finish booting" >&2
              adb devices -l || true
              exit 1
            fi
            # Android may report boot complete before Package Manager is ready.
            for attempt in $(seq 1 12); do
              if adb shell cmd package list packages >/dev/null 2>&1; then break; fi
              adb reconnect || true
              sleep 5
            done
            # Retry transient emulator Package Manager / ADB pipe failures.
            installed=0
            for attempt in $(seq 1 5); do
              if adb install -r app/build/outputs/apk/debug/app-debug.apk; then
                installed=1
                break
              fi
              adb reconnect || true
              sleep 8
            done
            if [ "$installed" -ne 1 ]; then
              adb devices -l || true
              adb logcat -d -t 600 > startup-logcat.txt || true
              echo "FAIL: APK installation failed after 5 attempts" > startup-result.txt
              exit 1
            fi
            adb shell am force-stop com.zallrw.admin
            adb shell am start -n com.zallrw.admin/.MainActivity
            sleep 25
            PID="$(adb shell pidof com.zallrw.admin | tr -d '\r')"
            adb logcat -d -t 600 > startup-logcat.txt || true
            if [ -n "$PID" ]; then
              echo "PASS: com.zallrw.admin survived 25 seconds after launch (pid=$PID)" > startup-result.txt
            else
              echo "FAIL: com.zallrw.admin process was not alive 25 seconds after launch" > startup-result.txt
              exit 1
            fi

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-ADMIN-STARTUP-DIAGNOSTICS
          path: |
            startup-result.txt
            startup-logcat.txt
          if-no-files-found: warn

      - name: Upload Admin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-ADMIN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
