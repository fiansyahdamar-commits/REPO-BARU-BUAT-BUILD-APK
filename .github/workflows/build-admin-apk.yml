name: Build Zall RW Admin APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/build-admin-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Smoke-test APK startup in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -wipe-data -no-snapshot -memory 2048 -cores 2 -camera-back none
          disable-animations: true
          script: bash scripts/smoke-test-admin.sh

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-ADMIN-STARTUP-DIAGNOSTICS
          path: |
            startup-result.txt
            startup-logcat.txt
          if-no-files-found: warn

      - name: Upload Admin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZallRW-ADMIN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
